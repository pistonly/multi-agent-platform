services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      MAP_DATABASE_URL: sqlite:////app/data/map.db
      MAP_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://web

  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      - api
