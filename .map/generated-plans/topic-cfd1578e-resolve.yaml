decision: "采用混合方案（SSE/事件驱动 + 极低频兜底轮询），不做纯 hook；分两阶段实验，本次先开 Phase 1（增量 diff 轮询 + inbound_event/幂等/审计三件基础设施，polling-only）"
rationale: "两轮讨论 4 议题全部收敛：①审计表选 B 新建 inbound_event（不复用 WebhookDelivery，不做通用 EventDelivery）②跨 persona 隔离选 A per-persona channel（已核代码 agents.py:188-190 + notification_stream.py，是既成事实）③兜底频率 10min（走 MAP_RUNTIME_INTERVAL，Phase 1 不锁死）④Phase 1 gate=重放/并发零误唤醒 + 审计三段可 join，P95 为副产品。reviewer Round 2 缺席，按 topic-host 收尾时机规则不等待，participant + host 共识达成。"
rejected_options: "纯 hook（无兜底，漏事件无法补偿）；复用 WebhookDelivery + direction=inbound（outbound 语义污染）；通用 EventDelivery 表（一次迁移涉及所有 webhook 项目方，scope 失控）"
open_questions: "1) 议题 3 兜底频率 SLA 终值（10min vs 15min）留 reviewer 在实验 review 阶段补刀；2) Cursor SDK backend 钩子能否订阅外部 SSE 长连（关系到 backend 边界硬约束是否成立）需 Phase 2 前验证"
action_items:
  - title: "Phase 2 实验设计：SSE 叠加（waker 切 SSE 长连 + lifecycle 事件补 publish + 重连补偿）"
    description: "Phase 1 验收通过后启动。基于 Phase 1 的 inbound_event/fingerprint/重放拒绝基础设施，叠加 SSE 触发；验证重连补偿、漏事件补救、重试风暴限速。前置：Phase 1 全部 acceptance 通过。"
    owner_agent_id: "8ab78cfc-8289-442e-ae63-fa0df4d2cd68"
  - title: "验证 Cursor SDK backend 能否订阅外部 SSE 长连"
    description: "关系到硬性约束「hook 路径只跑 Claude Code CLI」是否成立。若 Cursor SDK 不能订阅外部 SSE，则该约束固化；若能，需重新评估 backend 边界。Phase 2 前完成。"
    owner_agent_id: "98b23700-8386-4def-8235-afe252c1df35"
