name: Nightly

# 跑全量测试套件（slow + integration + alembic 全链路 + 覆盖率），
# 默认 PR/push 触发的 CI 只跑 unit 子集（快反馈），nightly 兜底跑慢路径。
# claude_cli marker 仍排除（需要登录态，无法在 CI 跑）。

on:
  schedule:
    # 每天 UTC 02:30（北京时间 10:30）跑一次
    - cron: "30 2 * * *"
  workflow_dispatch: # 允许手动触发，便于发版前 / hotfix 后手动跑全量

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check server cli sdk scripts tests alembic test_project

      - name: Python dependency audit (pip-audit)
        # 审计 #13：前端已有 npm audit，Python 侧此前无漏洞扫描。
        # 与 Codecov 步骤同款处理（软失败 + 可见告警）：依赖漏洞的升级
        # 决策常涉及跨大版本（如 starlette），不宜由 nightly 直接阻断，
        # 但必须让人看见——结论与豁免记录在 docs/AUDIT-2026-09-14.md。
        id: pip_audit
        continue-on-error: true
        run: |
          pip install --quiet pip-audit
          pip-audit --progress-spinner=off

      - name: pip-audit 漏洞告警（软失败，但必须可见）
        if: steps.pip_audit.outcome == 'failure'
        run: |
          echo "::warning title=Python 依赖存在已知漏洞::pip-audit 报告了漏洞" \
               "（软失败，不阻断 nightly）。查看上一步输出评估升级；" \
               "结论与豁免记录到 docs/AUDIT-2026-09-14.md。"

      - name: Alembic migrations (full upgrade path)
        run: |
          tmpdb="$(mktemp /tmp/map-nightly-XXXXXX.db)"
          MAP_DATABASE_URL="sqlite:///$tmpdb" alembic upgrade head
          # 顺便验证降级路径可逆（最后一个 migration 至少能回退一格）
          MAP_DATABASE_URL="sqlite:///$tmpdb" alembic downgrade -1
          rm -f "$tmpdb"

      - name: Pytest full suite (slow + integration, no claude_cli)
        # -m "" 表示不应用 marker 过滤（跑全部）；
        # 再用 --deselect 之类排除 claude_cli 不通用，故用 -m "not claude_cli"
        # 让 marker 显式排除。slow / integration 这两个 marker 在 nightly 必须跑。
        # T34（2026-09-01）：-n auto 并行缩短全量套件墙钟时间（coverage
        # 经 --cov 合并各 worker 数据，结果与串行一致）。
        # --cov-branch：与 ci.yml 同理——子进程覆盖率数据必须与主进程同为
        # branch 模式，否则 combine() 崩溃（详见 ci.yml backend job 注释）。
        run: pytest -m "not claude_cli" -n auto --cov --cov-branch --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() }}
        # 审计 #8：原先 ``fail_ci_if_error: false`` 让上传失败完全静默——
        # 覆盖率趋势会无声消失。这里反转职责：由 action 负责「判定失败」
        # （fail_ci_if_error: true），由 continue-on-error 负责「不阻断」，
        # 失败状态因此能被下一步捕获并升级为可见告警。
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Codecov 上传失败告警（软失败，但必须可见）
        if: steps.codecov.outcome == 'failure'
        run: |
          echo "::warning title=Codecov 上传失败::覆盖率未上传（软失败，不阻断 nightly）。" \
               "趋势数据会中断——请检查 CODECOV_TOKEN 是否过期 / 网络连通性 / codecov 服务状态。"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
