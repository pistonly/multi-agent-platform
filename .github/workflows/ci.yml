name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Ruff
        run: ruff check server cli sdk tests

      - name: Alembic migrations
        run: |
          tmpdb="$(mktemp /tmp/map-ci-XXXXXX.db)"
          MAP_DATABASE_URL="sqlite:///$tmpdb" alembic upgrade head
          rm -f "$tmpdb"

      - name: Pytest with coverage
        # 默认 addopts 已排除 slow/integration/claude_cli，与 PR 上跑的子集一致。
        # --cov 配置见 pyproject.toml [tool.coverage]；fail_under=60 阈值兜底。
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  gen-types:
    # 校验 web/src/api/types.generated.ts 与 sdk schemas 一致：改了 schema 必须
    # 跑 `python scripts/gen_types.py` 重新生成并提交，否则 git diff 非零 fail。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Regenerate types.generated.ts
        run: python scripts/gen_types.py

      - name: Verify generated file is up to date
        run: git diff --exit-code -- web/src/api/types.generated.ts
