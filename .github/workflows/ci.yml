name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # eng experiment (55634575) PR1: pin uv to a fixed version so
        # local + CI + Dockerfile all agree. Bump in lockstep.
        run: pip install "uv==0.8.14"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (frozen)
        # uv.lock is the source of truth; --frozen fails the build if
        # pyproject changed without re-locking.
        run: uv sync --frozen --extra dev --extra mcp

      - name: Install package in editable mode
        run: uv pip install --python "$(uv python find)" -e ".[dev,mcp]"

      - name: Ruff
        run: ruff check server cli sdk tests

      - name: Mypy strict (topics.py 渐进首目录)
        # eng experiment (55634575) PR2: strict on server/api/topics.py
        # only. PR3-PR5 will add experiments / agents / services in
        # order. Pyproject [[tool.mypy.overrides]] enforces the
        # directory promotion so the strict surface is grep-able.
        run: mypy server/api/topics.py server/api/experiments.py server/api/projects.py server/api/agents.py server/services/project_service.py server/services/phase_service.py server/services/experiment_capabilities_service.py server/services/mention_service.py server/services/todo_service.py server/services/topic_comment_service.py server/services/agent_work_service.py server/services/topic_work_item_service.py server/services/notification_service.py

      - name: Alembic migrations
        run: |
          tmpdb="$(mktemp /tmp/map-ci-XXXXXX.db)"
          MAP_DATABASE_URL="sqlite:///$tmpdb" alembic upgrade head
          rm -f "$tmpdb"

      - name: Pytest (unit subset)
        # PR 只跑 unit 子集（fast gate，默认 addopts 排除 slow/integration/claude_cli）求快反馈。
        # coverage 改由 nightly 跑全量时统计——fast gate unit 覆盖(~29%)不足以代表整体，
        # 在 PR 强制 fail_under=60 会持续误报。见 .github/workflows/nightly.yml。
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  gen-types:
    # 校验 web/src/api/types.generated.ts 与 sdk schemas 一致：改了 schema 必须
    # 跑 `python scripts/gen_types.py` 重新生成并提交，否则 git diff 非零 fail。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Regenerate types.generated.ts
        run: python scripts/gen_types.py

      - name: Verify generated file is up to date
        run: git diff --exit-code -- web/src/api/types.generated.ts
