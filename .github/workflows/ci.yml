name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # T30：ruff/mypy/alembic/check-deprecated 拆出单版本独立 job——
    # 原先这些 lint 类步骤在 3.10/3.11/3.12 三个 matrix leg 各跑一遍（×3 浪费），
    # 现在测试 matrix 只跑 pytest。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legacy entry matrix checks (stub + registration)
        # 实验 124e9a00 A3 防回潮：deprecated 启动脚本必须保持 stub；
        # 退役声明处引用的启动路径必须在 LEGACY-ENTRY-MATRIX 登记。
        run: bash scripts/check-deprecated.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (cached)
        # eng experiment (55634575) PR1: pin uv to a fixed version so
        # local + CI + Dockerfile all agree. Bump in lockstep.
        # T05（2026-08）：setup-uv enable-cache 替代裸 `pip install uv`——
        # 依赖包缓存以 uv.lock 为 key 恢复，不再每次全量下载。
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (frozen)
        # uv.lock is the source of truth; --frozen fails the build if
        # pyproject changed without re-locking.
        run: uv sync --frozen --extra dev --extra mcp

      - name: Add .venv/bin to PATH
        # 修复上游 CI 连红（8-28 起）：uv sync 装包进 .venv 但 .venv/bin
        # 不在 PATH，裸调 ruff/mypy/alembic/pytest 全部 command not found
        # (exit 127)——lint 错误因此从未真正在 CI 执行过。
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install package in editable mode
        run: uv pip install --python "$(uv python find)" -e ".[dev,mcp]"

      - name: Ruff
        run: ruff check server cli sdk scripts tests alembic test_project

      - name: Mypy strict (topics.py 渐进首目录)
        # eng experiment (55634575) PR2: strict on server/api/topics.py
        # only. PR3-PR5 will add experiments / agents / services in
        # order. Pyproject [[tool.mypy.overrides]] enforces the
        # directory promotion so the strict surface is grep-able.
        run: mypy server/api/topics.py server/api/experiments.py server/api/projects.py server/api/agents.py server/services/project_service.py server/services/phase_service.py server/services/experiment_capabilities_service.py server/services/mention_service.py server/services/todo_service.py server/services/topic_comment_service.py server/services/agent_work_service.py server/services/topic_work_item_service.py server/services/notification_service.py server/services/topic_service.py

      - name: Alembic migrations
        run: |
          tmpdb="$(mktemp /tmp/map-ci-XXXXXX.db)"
          MAP_DATABASE_URL="sqlite:///$tmpdb" alembic upgrade head
          rm -f "$tmpdb"

  backend:
    runs-on: ubuntu-latest
    # eng experiment (55634575) PR8: pyproject requires-python=">=3.10",
    # but the project only tested on 3.12 — a real coverage gap. Pin
    # 3.10 / 3.11 / 3.12 in matrix; uv.lock is frozen so installs are
    # reproducible across all three. Bump in lockstep when adding 3.13.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (cached)
        # eng experiment (55634575) PR1: pin uv to a fixed version so
        # local + CI + Dockerfile all agree. Bump in lockstep.
        # T05（2026-08）：setup-uv enable-cache 替代裸 `pip install uv`——
        # 依赖包缓存以 uv.lock 为 key 恢复，三个 matrix leg 不再每次全量下载。
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (frozen)
        # uv.lock is the source of truth; --frozen fails the build if
        # pyproject changed without re-locking.
        run: uv sync --frozen --extra dev --extra mcp

      - name: Add .venv/bin to PATH
        # 同 lint job：uv sync 装进 .venv，PATH 注入后 pytest 可用。
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install package in editable mode
        run: uv pip install --python "$(uv python find)" -e ".[dev,mcp]"

      - name: Pytest (unit subset, parallel + coverage visibility)
        # PR 只跑 unit 子集（fast gate，默认 addopts 排除 slow/integration/claude_cli）求快反馈。
        # T34（2026-09-01）：-n auto 并行（本地实测 213s → 47s）+ --cov 展示
        # PR 侧覆盖率；不 fail_under——unit subset 覆盖率不代表整体，强制
        # 阈值会持续误报。全量覆盖率门禁在 nightly（--cov-report=xml → Codecov）。
        run: pytest -n auto --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Sync bundled SPA into server/web_dist layout
        # Exercises scripts/sync-web-dist.sh so a missing rsync/copy
        # path fails CI before a release wheel ships without the board.
        run: bash ../scripts/sync-web-dist.sh --skip-build

  gen-types:
    # 校验 web/src/api/types.generated.ts 与 sdk schemas 一致：改了 schema 必须
    # 跑 `python scripts/gen_types.py` 重新生成并提交，否则 git diff 非零 fail。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Regenerate types.generated.ts
        run: python scripts/gen_types.py

      - name: Verify generated file is up to date
        run: git diff --exit-code -- web/src/api/types.generated.ts

  packaging:
    # T29：干净 checkout 打的 wheel 必须带 SPA（web_dist/assets）和 alembic。
    # frontend job 只证明 sync-web-dist.sh 能跑；本 job 解包发行物做硬校验。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build tooling
        run: pip install build

      - name: Build SPA and unpack-check sdist/wheel
        run: |
          bash scripts/sync-web-dist.sh
          bash scripts/check-packaging.sh
