# MAP pre-commit 钩子（T46）
#
# 安装（一次性，不进 dev extra 以免动 uv.lock）：
#     pip install pre-commit    # 或 uvx pre-commit
#     pre-commit install
#
# 说明：全部走 ``language: system`` 的 local hook，直接复用仓库 venv 里已有的
# ruff / mypy（版本与 CI 的 dev extra 一致），不额外拉 hook 仓库、不受 hook
# 上游 tag 影响。CI（.github/workflows/ci.yml 的 lint job）仍是最终权威门禁，
# 这里的意义是把 ruff / mypy / skill 双镜像检查左移到提交前——CI 曾连续三周
# 红灯无人接，就是因为本地没有任何防线。
#
# 未启用的项（有意为之，详见 docs/AUDIT-2026-09-14.md）：
#   - ruff-format：仓库 441/625 文件尚未格式化，启用会把每个提交都变成
#     全量重排。等一次性 `ruff format` 落地后再打开。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (E/F/B/UP/I/SIM)
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: check-deprecated
        name: legacy entry matrix（stub + 登记）
        entry: bash scripts/check-deprecated.sh
        language: system
        pass_filenames: false

      - id: skills-mirror-drift
        name: skills 双镜像一致性（cli/skills ↔ .cursor/skills）
        # 分发走 cli/skills（wheel package data），.cursor/skills 是本仓 dogfood
        # 副本；两处不同步会让 wheel 与仓库副本漂移。__init__.py 是分发侧独有。
        entry: bash -c 'diff -r -x "__init__.py" cli/skills .cursor/skills'
        language: system
        pass_filenames: false
        files: ^(cli/skills/|\.cursor/skills/)

      - id: mypy-protected
        name: mypy strict（受保护模块清单，与 CI lint job 同源）
        # 清单必须与 pyproject [[tool.mypy.overrides]] 的 module 列表一致，
        # 由 tests/test_mypy_gate_sync.py 守卫；改任一处都要同步另一处。
        entry: mypy
        language: system
        files: ^server/(api|services)/.*\.py$
        args:
          - server/api/topics.py
          - server/api/experiments.py
          - server/api/experiment_execution.py
          - server/api/experiment_reviews.py
          - server/api/projects.py
          - server/api/agents.py
          - server/services/project_service.py
          - server/services/phase_service.py
          - server/services/fs_projection_store.py
          - server/services/time_utils.py
          - server/services/experiment_capabilities_service.py
          - server/services/mention_service.py
          - server/services/todo_service.py
          - server/services/topic_comment_service.py
          - server/services/agent_work_service.py
          - server/services/topic_work_item_service.py
          - server/services/notification_service.py
          - server/services/notification_stalled.py
          - server/services/topic_service.py
          - server/services/topic_helpers.py
          - server/services/topic_lifecycle_service.py
          - server/services/topic_resolve_service.py
          - server/services/topic_action_item_ops.py
