reasonable_items:
  - "v2 圆满吸收 fa3b838b 全部整改点：A1 明确双界面同源（advance 报错 + host `map work` round_ack_pending 共用 effective-ack-authors）、D4 改为解析层共享合规标记计算、A5 覆盖 work 视图文案；且明确拒绝「声明差异为已知口径」的退让路线——与本话题主题（消除判据分叉）一致，整改态度正确"
  - "v2 新增 server 侧调研坐标基本准确可核证：fs_source_service.py:28 `from map_fs import (FsTopic, FsComment, derive_work, scan_plane, ...)`——server 确实复用 map_fs 解析层；`_TopicView` 由 `topic.comments`（parser FsComment）直接映射 _CommentView（300-330 行）"
  - "validate_fs_advance_round（实际定义 fs_source_service.py:1343）门槛逻辑核证：`authors = view.authors_in_round(view.round_number); missing = [p for p in view.participants if p != view.creator and p not in authors]`——名单过滤已是现状，D3 的 anomaly 增量为独立输出物，定位准确"
  - "测试面新增「work/advance 同源一致性」（同一手写文件在 round_ack_pending 与 advance missing 口径一致）单测——正是消除镜像分叉的可观测判据"
  - "其余 v1 已认可的合理点（调研事实准确、A2/A4 自洽、不追溯边界、窄口径纯 parser 修复）在 v2 全部保真"
unreasonable_items:
  - "v2 风险段的「server 侧只复用解析结果（missing 计算自动同源，无需改 server 逻辑）」断言与代码事实矛盾，与 D4 字面实现组合可导向 A1 不达标的路线：server 的 `_TopicView.authors_in_round`（fs_source_service.py:276-277）与 parser 端是**两处独立实现**——它遍历 `self.comments`（_CommentView 列表，由 parser FsComment 的 field 直接映射构造，fs_source_service.py:302-315）里**全部** `c.author`，不读 parser 的合规标记。若按 D4 实现为「FsComment 增加合规标记字段、parser 端 authors_in_round 只统计合规 author」而 server 不动，则 validate_fs_advance_round（1366-1369 行）的 missing 计算仍基于宽容 raw author（无 frontmatter 文件 fallback 为文件名 persona，fs_source_service 经 FsTopic 继承该语义）——不含规文件仍被计为已表态，A1「advance 报错内联 missing 不合规 persona」不达标。『无需改 server』仅在 parser **直接改变 author 值语义**（不合规文件 author 从 effective 集消失）时才成立；若保留 raw author 就需 server `_CommentView` 暴露合规标记并在 authors_in_round 过滤（等价一两行小改动，仍在窄范围）。请 plan revise 明确 server `_TopicView`/`authors_in_round` 的同步方式：either 在 D4 明示「合规判定使不合规 author 不出现在 effective authors（server 零改动继承）」并给 A1 对应的验收单测（advance 侧报错含该 persona），或 risk 段改为「server `_CommentView` 同步暴露合规标记并在 authors_in_round 过滤（一两行）」——消除「无需改 server」与实现路线的歧义，否则 A1/A4 的 advance 侧判定无法被正确实现并验证。"
