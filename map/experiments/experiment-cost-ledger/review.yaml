reasonable_items:
  - "目标清晰：补完 T5-A 后剩余历史态缺口——per-实验 token 成本无单一入口；范围明确（session jsonl 采集考证 + persona×实验 聚合 + 只读报表；不接外部 API、不回填历史外数据、不动 waker 状态机/心跳/签名/热自检）；与 T5-A 实时态叠加后监督者从「事后查」升级到「实时看 + 复盘算」"
  - "验收可观测（A1-A10）：A1 Layer1/2 分层（RawUsageEvent → NormalizedUsage + version+field_name dict）可复读；A2 assistant+result 双采集 + sanity 阈值 1% 可复读；A3 三重 fallback inline_field/file_window/post_accept_continuation/unmatched + matched_via 写入聚合可复读；A4 双命令入口 map experiment show --cost 主 + map waker costs --by-persona/--by-experiment 辅 + lib/cost_ledger/ 共享可复读；A5 match_breakdown 默认输出（不需 --verbose flag）可复读；A6 cache_creation/cache_read 独立计数不并入 input + 价目缺不允许 0 兜底可复读；A7 损坏行 warn 不崩 + 聚合无 cache + 跨主机不做可复读；A8 ≥8 case (a 多 persona 跨实验 / b 缺 usage unknown / c 损坏行 / d cache 分桶 / e 命令分工 / f 缺价目 / g match_breakdown 默认 / h spike 端到端) 可复读；A9 ruff 0 + pytest 1818 基线 0 failed + 窄白名单 ^cli/ ^sdk/ ^tests/ 硬校验；A10 边界 6 条（不动 waker 语义/不接 API/不回填/append-only 读/聚合无 cache/不复用 state.json）可复读"
  - "话题共识一致：完整吸收 experiment-cost-ledger 话题 (20d52df4) Round 1+2+3 三轮 host + participant 收口——Round 1 §1.1 采集分层 / §1.2 双采集 / §2 三重 fallback / §3 命令入口分工 / §4 (a)-(g) 7 case / §6 隐含边界 3 条 / §5 T5-A 复用边界；Round 2 host §未决项敲定 5 条全采纳 + §B1-B7 7 护栏 + §我补 (a)-(g) 7 case + §隐含边界 3 条 + §T5-A 闭环 + §实验入口校验 6 维度 + Round 2 participant §3 spike 选 3 实验做格式考证写进 plan §采集方案 前置要求；Round 3 host §§plan §采集方案 前置要求（I0 spike 选 T5-A + T2 b3ec2e4d + T3 7aeabc2e 三类生命周期）+ §plan §验收 10 项 + §plan §边界 6 条；plan dependencies 引用来源话题 20d52df4 Round 1+2+3"
  - "风险依赖充分：A10 边界段 6 条（不动 waker 状态机/心跳/签名去重/热自检任何语义 / 不接外部计费 API / 不回填历史 session 外数据 / session jsonl append-only 读取不持文件锁 / 聚合无 cache 每次命令实时扫描 < 1s / 不复用 T5-A state.json）；与 T1 8b1d20a1 签名去重 + T2 b3ec2e4d busy 拆分 + T3 7aeabc2e topic lifecycle + T4 d0c9dc5f drift 自检 + T5-A 715202a3 waker 巡检 五个实验链路无冲突（纯只读分析数据源不同）"
  - "实施顺序合理：I0 spike 选样 + 格式考证前置 → I1 Layer 1 采集器 RawUsageEvent → I2 Layer 2 映射器 NormalizedUsage + version+field_name dict → I3 归属映射三重 fallback + matched_via → I4 命令入口分工 + lib/cost_ledger/ 共享 + 缓存复用避免重复 IO → I5 match_breakdown 默认输出 → I6 sanity check + 缺价目只报 token 不 0 兜底 → I7 回归测试 ≥8 case (a-h) → I8 commit + log + release；I0 前置 spike 是 Layer 1/2 分层架构的数据依据（避免采集器对真实数据 schema 漏判），符合 round1 participant §1.1 + round2 participant §3 强化要求"
  - "依赖完整：来源话题 20d52df4 Round 1+2+3 全部共识；既有 .map/runtime-waker-sessions/*.jsonl（append-only 既有 runtime session 流，文件名格式 <ts>_<persona>_<id>.jsonl 含 persona + 时间戳匹配 participant §B2 file_window 推断依据，核证真实存在）；既有 T5-A 715202a3 waker 巡检视图（实时态一张图）+ 本实验历史态台账（历史态一笔账）= 监督 ROI 完整闭环；T1-T4 已落地链路无冲突；验收通过后由监督者重启 waker 生效（无 docker 镜像 build，仅 daemon restart）"
  - "evidence_keys 四类齐：spike_note.md（3 实验 session jsonl 格式考证 + 字段映射表 + 损坏行样本，按 I0 前置要求落地写进 experiment dir）+ 实测输出 5 项（map experiment show --cost 单实验 / map waker costs --by-persona 跨实验 / mock 损坏行 warn / mock 缺价目 pricing_unavailable / spike 三实验 raw jsonl 与聚合对账误差 < 1%）+ grep 核证（cli/cost_ledger/ 含 layer1_collector + layer2_mapper + attribution + render + lib/cost_ledger/ 共享聚合 + tests/test_cost_ledger.py 8 case）+ pytest_summary ≥8 case 全过全量 0 failed"
  - "与既有五个实验链路协调得当：与 T1 8b1d20a1 签名去重无冲突（只读分析不写 notification 通道）；与 T2 b3ec2e4d busy 拆分无冲突（数据源不同 jsonl vs heartbeat）；与 T3 7aeabc2e topic lifecycle 无冲突（不操作 topic 状态机）；与 T4 d0c9dc5f drift 自检无冲突（不写 state.json 不动 sync_runtime_skills）；与 T5-A 715202a3 waker 巡检视图**互补**（实时态一张图 + 历史态一笔账 = 监督 ROI 完整闭环，pricing_source_date 模块抽 lib/pricing/ 共用扩展点）；不引入新的 wake signature / work_items kind / server 端点 / DB 字段 / 外部计费 API"
