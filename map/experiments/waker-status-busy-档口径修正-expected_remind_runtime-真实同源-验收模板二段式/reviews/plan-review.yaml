reasonable_items:
- 目标清晰：修复 busy 档 180s 误报 vs server 30min 容忍（10× 口径差）；根因 cli/waker_status_view.py:154
  fallback 偷换 idle_stale_w 语义，T6 验收漏核 busy 档同帧一致教训已吸收
- 验收可观测（A1-A10）：A1 state.json 序列化 expected_remind_runtime_seconds（config + env）；A2
  CLI fallback chain 三层（state.json > env > 30min default，禁止回退 idle_stale）；A3 lib/waker_state.py
  dataclass schema 注释固化优先级链；A4 atomic write（tmp + os.replace + JSONDecodeError 重试一次）+
  tests/test_waker_state_atomic.py；A5 pid 存活双重校验（os.kill(pid, 0) and not is_zombie(pid)
  读 /proc/<pid>/status State）；A6 fixture-based 同帧测试 ≥6 case (a)-(f) 覆盖 <阈值 busy /
  >阈值 stale / 缺字段 fallback / pid zombie stale / 三层 fallback 都 30min / atomic write
  race 重试；A7 验收模板二段式（synthetic fixture + 真实环境 smoke）写入 experiment-host skill 视图类实验
  checklist；A8 3-waker smoke 覆盖（host 真实环境手动 + participant/reviewer pytest fixture
  mock 模拟）；A9 pytest 全量绿 + ruff 0 + 白名单 ^cli/ ^lib/ ^tests/ ^.cursor/skills/；A10 边界明确（不改
  server T2 容忍公式 / 不改 T6 已对齐 idle 档 / state.json 向后兼容 / cli 改动验收后监督者重启生效）
- 话题共识一致：完整吸收 waker-status-busy-threshold-fix 话题 Round 1 host + participant 双轮收口；plan
  §背景 §根因 §Round 1 共识三段式把现象、根因、共识对齐完整呈现；§Round 1 Summary 说明段诚实记录 CLI --force --round-summary
  路径解析异常事故，不掩饰
- 风险依赖充分：A10 边界段守住 server T2 / live / idle_stale / dead 档；state.json 新增字段向后兼容（缺字段
  fallback 不破坏旧 state）；result_review 阶段 action_items 显式收口（监督者重启 server + waker 生效，避免验收通过却未生效）；cli
  改动验收通过后由监督者重启生效（daemon restart，无 docker build）
- 实施步骤 I1-I8 顺序合理：I1 state.json 序列化 → I2 CLI fallback chain 重构 → I3 atomic write →
  I4 pid zombie 排除 → I5 schema 注释固化 → I6 ≥6 case fixture 测试 → I7 验收模板写入 skill → I8
  commit/log/release；每步可独立验收，不相互阻塞
- 依赖完整：topic b446d8ed Round 1 共识收口、cli/waker_status_view.py:154 待修锚点、server/services/status_service.py
  T2 同源基准、T6 (a8b64c20) idle 档已对齐链路、lib/waker_state.py dataclass 注释承载、A8 3-waker pytest
  fixture 实施细节都已列入 dependencies
- evidence_keys 四类齐：实测输出 (a)-(f) 六场景完整（mock busy_started_at / 缺字段 fallback / pid defunct
  / 三层 fallback / 半截 JSON 重试）+ grep 核证（cli/waker_status_view.py fallback chain / lib/waker_state.py
  dataclass 注释 / cli/simple_waker.py tmp+os.replace / tests/test_waker_state_atomic.py
  / .cursor/skills/experiment-host/SKILL.md 二段式）+ pytest_summary ≥6 case + 验收模板 skill
  写入核证
- Round 1 Summary CLI 事故披露诚实：plan §Round 1 Summary 说明段主动记录 `--force --round-summary
  --file` 路径解析异常把 round1-host.md 误覆盖的事故链；orphan round1-summary-host.md 完整保留作为事故痕迹；round1-host.md
  已恢复 T9 任务书原文（当前两个文件共存，content 各异，可读）
