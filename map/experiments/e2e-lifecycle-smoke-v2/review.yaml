reasonable_items:
  - "目标与范围清晰：v2 在 v1 6×4=24 cell 骨架上叠加 'post-R8/R9 ack refresh' 维度，与 R1-R7 交付链对齐，cite round7-participant.md §1/§2/§3 + round5-participant.md §2"
