  - "负面断言覆盖关键 persona 边界：5 条 negative assertion（host-only create / reviewer-only approve / executor-only log / reviewer-only accept-result / archived 后 409）守住 CLI 主链路权限门"
  - "三类共同一致性断言（6 条）覆盖 fs show / experiment show / phase / log.md / result_decision / archive 后 phase 六个共享视图"
  - "失败信号 + rollback + deliverables 闭环明确；产物路径与 v1 隔离（map/experiments/e2e-lifecycle-smoke-v2/）避免混淆"
  - "与 v1 (c839507f) 并存关系透明：v2 不强制 v1 withdraw，明确 'reviewer 可对 v1/v2 独立 approve/reject'，给 reviewer 决策空间"
