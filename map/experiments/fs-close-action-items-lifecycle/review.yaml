reasonable_items:
  - "根因定位准确且可核证：DB 时代 TopicActionItem 全链机制健在（topic_resolve_service.py:175 建行点带 owner 校验/first_open_at/audit 同事务），FS 路径 v0.13 起把 close_note 当纯文本写回 index.md 不入 DB——断链根因（机制非执行者过失）调研属实，活标本 merge-github-main-into-local 的「close 后 merge 未执行」正是该断链的实证"
  - "调研事实坐标全部核证一致：TopicActionItem 唯一建行点 topic_resolve_service.py:175（decision_id 关联、first_open_at 在 resolve 时 stamp 启动 waker T+24h/72h 计时，见 175-186 处注释）、validate_fs_close 定义 fs_source_service.py:1492、fs_write_commit server/api/fs.py:411（有 DB session + _COMMIT_EVENT['close']）、CLI validated_write_flow cli/commands/fs.py:433、409 actionable error 渲染范例 _render_ack_error（4b1192cc 落地）——逐一精确"
  - "方案结构合理：D1 方案 2（建行跟踪）为主 + D2 方案 1（门禁）为辅助防线，边界按 participant「close 时点就该完成」拆法落地；A6 保护纯结论性 close（无结构化段不建行不 409）避免误伤——与 A2 门禁形成对照，不阻塞合法 close 的语义自洽"
  - "I3 门禁落点正确：validate_fs_close 已接收 close_note 参数（1492 签名），可在服务端校验含 status: open 行时 409、不触碰已 done 或显式转跟踪的合法 close；与 I2 建行（commit 端 DB session）分层清晰"
  - "applied_fields 携带 close_note 的前提已由 schema 实证：FsWriteCommitRequest.applied_fields（sdk/python/map_types/schemas/fs.py:166-172）为 CLI 实际写回字段、与 verdict.fields 比对——remote/pure-token 模式同样由 CLI 回传，plan 风险段自查该点的方向正确"
  - "存量处置克制不越界：不 reopen、merge 补执行记本话题、本实验只回填可查 action item；push github 前用户显式确认的门禁语义独立保留——范围收窄合理"
  - "格式约定化（D3 owner/title/status 结构化段）+ 门禁 409 引导改结构化而非静默吞——对存量 - [ ] 任务列表习惯的迁移路径有交代；窄提交防并行污染已声明"
unreasonable_items:
  - "「I2 复用既有建行通路（非新表）直接建行」存在 DB 外键前提断点，plan 未论证 decision_id/topic_id 两个 NOT NULL 外键在 FS-only 话题下的来源：TopicActionItem 模型 decision_id→topic_decisions.id、topic_id→topics.id 均 nullable=False（server/domain/models.py:443/445）；而 FS 话题在 DB 中无对应 topics 行、更无 topic_decisions 行——map topic create 是纯本地 FS 写（cli/commands/topic.py:476 明确 no API write，write_new_fs_topic 只落 map/topics/）、models.py:358 注释明言「FS-plane uuid5 ids with no row here (Experiment.topic_id)」、fs_write_commit 只写 FsWriteReceipt+emit（server/api/fs.py:494-530）从不建 Topic/TopicDecision。topic_resolve_service.py:175 建行点的 decision 来自 resolve 流程（97 行 TopicDecision、_get_topic 取 DB 行），FS close 路径两者皆无——若按字面在 fs_write_commit close 分支 db.add(TopicActionItem(...)) flush 时必抛外键 IntegrityError，A1/A3/A4（建行→todos action_items 桶→waker 升级/complete）整链落空。请 plan revise 明确：a) bridge 时 decision_id/topic_id 指向哪一 DB 行——为 FS 话题引入 DB Topic 桩行 + TopicDecision、把 decision_id/topic_id 改 nullable（schema 迁移）、或论证既有 row 映射（slug→topics 行）存在；b) 给对应验收单测（建行后 FK 校验通过、`map action list` 可见），避免以「复用」一词掩盖需要新增的建行上下文。"
