reasonable_items:
  - "B1 走 WAKEABLE_NOTIFICATION_EVENTS 显式白名单（该集合注释要求新事件显式声明+评审——本评审即该评审），复用 wakeable 通道不新增 work kind，与 close_note D2 一致"
  - "B2 reject 不触发 + 状态机单次 accept→done 幂等论证成立"
  - "B6 复用 after-commit 发布机制与 accept 同事务——回滚不发，事务语义正确"
  - "stale_open_topics 兜底不动（B4），正道+兜底互补关系保留"
unreasonable_items:
  - "B5 覆盖了 FS 话题与存量 DB 话题两种降级，但漏了第三种：**experiment.topic_id 为空**（无话题实验，实验列表存在 TOPIC='-' 的先例）。该分支下 _notify_topic_close_pending 无话题可解析——需在 plan 显式定义：topic_id 为空时跳过通知（无收尾义务）而非报错/降级到 creator（无话题就没有 close 语义，降级发通知会把'请收尾话题'发给一个不存在的话题收件语境）。请修订 B5 补齐该分支及对应单测。"
