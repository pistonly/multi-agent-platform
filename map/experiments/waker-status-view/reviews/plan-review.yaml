reasonable_items:
- 目标清晰：堵「巡检靠拼四件套（pgrep/map work/tail/pstree）」系统缺口；范围明确（waker 自写 state + 视图只读纯末梢；不闭环回去，避免变自检触发器）；与
  T1 签名去重 / T2 busy 拆分 / T3 topic lifecycle / T4 drift 自检 单向流一致
- 验收可观测（A1-A8）：A1 单源 waker 自写 .map/waker-state.json atomic write（先 .tmp 再 rename）+
  视图只读 .map/waker-state.json + map work 心跳字段合成视图可复读；A2 stale 三档 live ≤ 30s / stale
  30s-300s / dead > 300s 或 pid 缺失 + busy_since > 5min 自动升级 stale（防卡死 busy 漏判）可复读；A3
  字段最小集 10 字段硬上限（persona | pid | uptime | last_poll | busy_since | cycles | reminds
  | skips | errors | state）+ errors_last_n 底线可复读；A4 视图只读（禁写日志/通知/重启 waker/改 state）可复读；A5
  重启时旧 state 归档为 .stale.<ts>.json + 新 cycles=0 可复读；A6 ≥5 case（live/stale/dead/卡死 busy/旧
  state 归档）可复读；A7 ruff 0 + pytest 0 failed + 窄白名单 ^cli/ ^tests/ 硬校验；A8 sync_runtime_skills
  不动 waker-state.json 边界守住
- 话题共识一致：完整吸收 waker-status-and-cost-ledger 话题 (7f0e8de7) Round 1+2 host + participant
  双轮收口——participant round1 §方向 A 4 护栏（A1 单源 / A2 stale 三档 / A3 字段最小集 / A4 视图只读）+ 我补
  2 case（state 归档 + busy_since 卡死升级）；host round2 §未决项敲定 5 条全采纳（拆分判断 / state 文件位置 +
  划入 sync 边界外 / 价目表默认 + 90 天 WARN / 字段最小集 10）+ 隐含边界 3 条（state 与 runtime_home 同级但隔离
  / session jsonl 隐私 / unknown bucket 不静默）；plan dependencies 引用来源话题 7f0e8de7
- 风险依赖充分：A8 边界段 5 条（sync_runtime_skills 不镜像 waker-state.json / 不引入新 server 端点或 DB
  字段 / 不影响 T1-T4 已落地链路只读数据源 / 视图是末梢不闭环避免变自检触发器 / 不引入外部依赖如 psutil）；与本战役 8b1d20a1 fan-out
  收窄 + b3ec2e4d busy 拆分 + 7aeabc2e topic lifecycle + d0c9dc5f drift 自检 链路无冲突
- 实施顺序合理：I1 调研既有 state 文件（.map/simple-waker-state.json 已有 runtime session 不重叠）→ I2
  waker 写 state (atomic write + 启动调用 + 每 cycle 末尾更新 + 旧 state 归档) → I3 视图渲染（cli/commands/waker_status.py
  新建 10 字段 + stale 三档 + 视图只读）→ I4 回归测试 ≥5 case（tests/test_waker_status.py 新建）→ I5
  commit + log + release；既有 _save_state_if_needed (cli/simple_waker.py:915-1282 多次调用点)
  作为 hook 参照
- 依赖完整：来源话题 7f0e8de7 决议、现有 cli/simple_waker.py:_save_state_if_needed (line 915/926/961/1192/1218/1238/1282)
  + .map/simple-waker-state.json（line 206 默认路径）、现有 cli/waker_heartbeat_render.py 心跳/busy
  渲染层（line 51-59 busy_since 字段，b3ec2e4d 已落地）、现有 cli/simple_waker.py:_skill_audit_logger
  (line 48) T4 drift 自检已集成、既有 sync_runtime_skills 全量镜像机制（d0c9dc5f）—— waker-state.json
  明确划入镜像边界外
- evidence_keys 三类齐：pytest_summary（≥5 新 case test_waker_status.py 全过，全量 pytest -q
  0 failed）+ 实测输出（1 waker 启动 atomic write 验证 / 2 cycle 末尾累加 cycles/reminds/skips/errors
  / 3 mock pid 缺失 state=dead / 4 mock busy_since=10min 前 state=stale / 5 重启 waker
  旧 state 归档 + 新 cycles=0）+ grep 核证（cli/simple_waker.py 含 _save_waker_state + atomic
  rename / cli/commands/waker_status.py 新建视图渲染 / tests/test_waker_status.py 含 live/stale/dead/busy-stale/state-archive
  5 case）
- 与既有四个实验链路协调得当：与 8b1d20a1 签名去重无冲突（视图只读不写通知通道）；与 b3ec2e4d busy 拆分协调（A2 busy_since
  > 5min 升级 stale 沿用 T2 拆分口径）；与 7aeabc2e topic lifecycle 不变量解耦（state.json 与 topic
  状态机无关）；与 d0c9dc5f drift 自检解耦（sync_runtime_skills 不动 state，与 T4 边界一致）；不引入新的 wake
  signature / work_items kind / server 端点 / DB 字段
