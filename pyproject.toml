[project]
name = "multi-agent-platform"
version = "0.6.0"
description = "Multi-Agent experiment collaboration platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    # CLI 轻量依赖：仅 SDK + CLI 运行所需。
    # server 相关依赖（fastapi/sqlalchemy/uvicorn 等）见 [server] extra。
    # 声明范围尽量宽（下一 major / 0.x 下一大跨度），方便与用户环境共存；
    # 本仓库 CI 仍由 uv.lock 钉死已验证版本。
    "typer>=0.15.0,<0.28",
    "httpx>=0.28.0,<1",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.10.0,<3",
]

[project.urls]
Homepage = "https://github.com/quantaeye/multi-agent-platform"
Documentation = "https://github.com/quantaeye/multi-agent-platform/tree/main/docs"
Repository = "https://github.com/quantaeye/multi-agent-platform"
Issues = "https://github.com/quantaeye/multi-agent-platform/issues"

[project.optional-dependencies]
# server 依赖：运行 MAP API server 所需（fastapi/sqlalchemy/uvicorn 等）。
# 安装方式：pip install "multi-agent-platform[server]" 或 pip install multi-agent-platform-server
server = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "bcrypt>=4.2.0,<6.0",
    "python-multipart>=0.0.17,<1",
    # Fernet at-rest encryption for Webhook.secret (EncryptedString)
    "cryptography>=44.0.0,<50.0",
]
dev = [
    "multi-agent-platform[server]",  # server 依赖：测试需要
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2.0",
    "pytest-cov>=5.0.0,<8.0",
    "httpx>=0.28.0,<1",
    "mcp>=1.26.0,<2.0",
    "ruff>=0.8.0,<1.0",
    # codegen：从 Pydantic schema 生成 web/src/api/types.generated.ts
    # （配合 web 的 json-schema-to-typescript 提供 json2ts CLI，见 scripts/gen_types.py）。
    "pydantic-to-typescript>=2.0.0,<3.0",
]
mcp = [
    "multi-agent-platform[server]",  # 需要 fastapi/starlette
    "mcp>=1.26.0,<2.0",
]
claude-runtime = [
    # Optional: needed only by tests that import claude_agent_sdk directly
    # (tests/test_agent_client.py). Install with: pip install -e ".[dev,claude-runtime]"
    "claude-agent-sdk>=0.2,<1.0",
]

[project.scripts]
map-server = "server.main:run"
map = "cli.main:main"
# DEPRECATED (Phase 1 retained): see docs/LEGACY-ENTRY-MATRIX.md — use simple-waker + persona Skill
map-participant-bridge = "cli.participant_worker:main"
map-reviewer-bridge = "cli.reviewer_worker:main"
map-mcp = "map_mcp.main:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]

[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["server*", "cli*", "map_client*", "map_fs*", "map_mcp*", "map_sdk*", "map_types*"]

[tool.setuptools.package-data]
"cli.skills" = ["**/*.md", "**/*.sh", "**/*.yaml"]
# Bundled React SPA (scripts/sync-web-dist.sh → server/web_dist). Required
# in the wheel so `map-server` can serve the board without a git clone.
"server" = ["web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 测试分层（详见 tests/README.md）：
# - unit：默认，纯 in-memory sqlite + TestClient + mock，秒级
# - slow：单测耗时 >1s，含多线程 / SSE / file-backed sqlite / phase1 acceptance
# - integration：多进程 / 真 httpx / 真 systemd / 压力测试，分钟级
# - claude_cli：真调用 `claude --print` 子进程（需登录），integration 子集
# 默认 addopts 排除 slow/integration/claude_cli，本地 PR 用 `pytest` 即可；
# `pytest -m integration` 跑集成；`pytest -m claude_cli` 跑真 CLI；
# `pytest --marker-all` 或 `pytest -m ""` 跑全量。
addopts = "-m 'not slow and not integration and not claude_cli'"
markers = [
    "slow: 单测耗时 >1s 或使用多线程/SSE/file-backed sqlite（本地默认 skip）",
    "integration: 多进程/真 httpx/真 systemd/压力测试，应在 CI nightly 跑",
    "claude_cli: 真调用 `claude --print` 子进程，需 claude CLI 登录态；integration 子集",
    "claude_runtime: 依赖 claude_agent_sdk import 的测试（test_agent_client）；未装 SDK 时 importorskip 跳过",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["reference", "tmp"]

[tool.ruff.lint]
# E/F 基础；B bugbear 抓常见 bug；UP pyupgrade 现代化语法；I isort；SIM 简化。
# B008 全局忽略：FastAPI 的 Depends/Path/Query/Cookie 等是函数调用默认参数，属框架惯例。
# （UP038 曾在此忽略，ruff 0.9 起规则被上游移除，引用只会告警，故删除。）
select = ["E", "F", "B", "UP", "I", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
# eng experiment (55634575) PR2: mypy strict by directory (渐进式).
# Baseline = non-strict; we turn strict on per-module via [[tool.mypy.overrides]]
# so each PR can promote one more directory without churning unrelated files.
python_version = "3.10"
mypy_path = "sdk/python"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
# ``attr-defined`` is disabled project-wide because the codebase uses
# ``from x import *`` re-export shims (server/domain/schemas.py,
# server/domain/models.py). Promoting strict per-module [[overrides]]
# re-enables it where actual code lives.
disable_error_code = ["attr-defined", "no-untyped-def"]
# plugins deferred — pydantic-mypy setup is a separate PR to keep
# this PR scoped to "strict on one directory, baseline permissive".

[[tool.mypy.overrides]]
# The directories under strict so far. PR3 promoted experiments +
# projects alongside the original topics entry. PR4 promoted agents.
# PR5+ appends services (subdir-by-subdir) one at a time so each PR
# stays contained.
module = [
    "server.api.topics",
    "server.api.experiments",
    "server.api.projects",
    "server.api.agents",
    "server.services.project_service",
    "server.services.phase_service",
    "server.services.experiment_capabilities_service",
    "server.services.mention_service",
    "server.services.todo_service",
    "server.services.topic_comment_service",
    "server.services.agent_work_service",
    "server.services.topic_work_item_service",
    "server.services.notification_service",
    "server.services.topic_service",
    "server.services.topic_helpers",
    "server.services.topic_lifecycle_service",
    "server.services.topic_resolve_service",
    "server.services.topic_action_item_ops",
]
strict = true

[[tool.mypy.overrides]]
# Re-export shims use ``from map_types.schemas import *`` so mypy can't
# statically prove which names are exported. We re-enable ``attr-defined``
# here only to avoid false positives; the underlying types are validated
# at the SDK boundary.
module = ["server.domain.schemas", "server.domain.models"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# Alembic env.py imports from project modules but isn't a typing target.
module = ["alembic.*"]
ignore_missing_imports = true

[tool.coverage.run]
# 关注生产代码的覆盖率；测试脚本、迁移、SDK 生成代码不计入。
source = ["server", "cli", "map_client", "map_mcp"]
branch = true
omit = [
    # alembic migrations 是 DDL 声明，没有可测的分支
    "alembic/*",
    # SDK 类型由 pydantic 模型生成
    "sdk/python/map_types/__init__.py",
]

[tool.coverage.report]
# CI 上覆盖率低于此阈值则 fail，避免覆盖率无声下滑。
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
