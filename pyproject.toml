[project]
name = "multi-agents-platform"
version = "0.1.0"
description = "Multi-Agent experiment collaboration platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.x 库约束到下个 minor（0.x 阶段每个 minor 都可能 breaking），
    # 1.x+ 库约束到下个 major（语义化版本）。
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.41",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<2.0",
    "pydantic>=2.10.0,<2.12",
    "pydantic-settings>=2.6.0,<2.9",
    "bcrypt>=4.2.0,<6.0",
    "python-multipart>=0.0.17,<0.1",
    "typer>=0.15.0,<0.17",
    "httpx>=0.28.0,<0.29",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<7.0",
    "httpx>=0.28.0,<0.29",
    "mcp>=1.26.0,<2.0",
    "ruff>=0.8.0,<1.0",
    # codegen：从 Pydantic schema 生成 web/src/api/types.generated.ts
    # （配合 web 的 json-schema-to-typescript 提供 json2ts CLI，见 scripts/gen_types.py）。
    "pydantic-to-typescript>=2.0.0,<3.0",
]
mcp = [
    "mcp>=1.26.0,<2.0",
]
codex-runtime = [
    # REMOVED in eng PR1 (2026-07-09): openai-codex was a placeholder
    # dependency that never resolved on PyPI and broke `uv lock`. The
    # codex runtime integration never shipped; remove the extra
    # entirely if no caller appears by 2026-Q4.
]

[project.scripts]
map-server = "server.main:run"
map = "cli.main:main"
# DEPRECATED (Phase 1 retained): see docs/LEGACY-ENTRY-MATRIX.md — use simple-waker + persona Skill
map-participant-bridge = "cli.participant_worker:main"
map-reviewer-bridge = "cli.reviewer_worker:main"
map-mcp = "map_mcp.main:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]

[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["server*", "cli*", "map_client*", "map_mcp*", "map_sdk*", "map_types*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 测试分层（详见 tests/README.md）：
# - unit：默认，纯 in-memory sqlite + TestClient + mock，秒级
# - slow：单测耗时 >1s，含多线程 / SSE / file-backed sqlite / phase1 acceptance
# - integration：多进程 / 真 httpx / 真 systemd / 压力测试，分钟级
# - claude_cli：真调用 `claude --print` 子进程（需登录），integration 子集
# 默认 addopts 排除 slow/integration/claude_cli，本地 PR 用 `pytest` 即可；
# `pytest -m integration` 跑集成；`pytest -m claude_cli` 跑真 CLI；
# `pytest --marker-all` 或 `pytest -m ""` 跑全量。
addopts = "-m 'not slow and not integration and not claude_cli'"
markers = [
    "slow: 单测耗时 >1s 或使用多线程/SSE/file-backed sqlite（本地默认 skip）",
    "integration: 多进程/真 httpx/真 systemd/压力测试，应在 CI nightly 跑",
    "claude_cli: 真调用 `claude --print` 子进程，需 claude CLI 登录态；integration 子集",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reference", "tmp"]

[tool.ruff.lint]
# E/F 基础；B bugbear 抓常见 bug；UP pyupgrade 现代化语法；I isort；SIM 简化。
# B008 全局忽略：FastAPI 的 Depends/Path/Query/Cookie 等是函数调用默认参数，属框架惯例。
select = ["E", "F", "B", "UP", "I", "SIM"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
# eng experiment (55634575) PR2: mypy strict by directory (渐进式).
# Baseline = non-strict; we turn strict on per-module via [[tool.mypy.overrides]]
# so each PR can promote one more directory without churning unrelated files.
python_version = "3.11"
mypy_path = "sdk/python"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
# ``attr-defined`` is disabled project-wide because the codebase uses
# ``from x import *`` re-export shims (server/domain/schemas.py,
# server/domain/models.py). Promoting strict per-module [[overrides]]
# re-enables it where actual code lives.
disable_error_code = ["attr-defined", "no-untyped-def"]
# plugins deferred — pydantic-mypy setup is a separate PR to keep
# this PR scoped to "strict on one directory, baseline permissive".

[[tool.mypy.overrides]]
# The directories under strict so far. PR3 promoted experiments +
# projects alongside the original topics entry. PR4 promoted agents.
# PR5+ will append services (subdir-by-subdir) in order.
module = [
    "server.api.topics",
    "server.api.experiments",
    "server.api.projects",
    "server.api.agents",
]
strict = true

[[tool.mypy.overrides]]
# Re-export shims use ``from map_types.schemas import *`` so mypy can't
# statically prove which names are exported. We re-enable ``attr-defined``
# here only to avoid false positives; the underlying types are validated
# at the SDK boundary.
module = ["server.domain.schemas", "server.domain.models"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# Alembic env.py imports from project modules but isn't a typing target.
module = ["alembic.*"]
ignore_missing_imports = true

[tool.coverage.run]
# 关注生产代码的覆盖率；测试脚本、迁移、SDK 生成代码不计入。
source = ["server", "cli", "map_client", "map_mcp"]
branch = true
omit = [
    # alembic migrations 是 DDL 声明，没有可测的分支
    "alembic/*",
    # SDK 类型由 pydantic 模型生成
    "sdk/python/map_types/__init__.py",
]

[tool.coverage.report]
# CI 上覆盖率低于此阈值则 fail，避免覆盖率无声下滑。
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
