[project]
name = "multi-agents-platform"
version = "0.1.0"
description = "Multi-Agent experiment collaboration platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "mcp>=1.26.0",
    "ruff>=0.8.0",
]
mcp = [
    "mcp>=1.26.0",
]

[project.scripts]
map-server = "server.main:run"
map = "cli.main:main"
map-host-worker = "cli.host_worker:main"
map-mcp = "map_mcp.main:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]

[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["server*", "cli*", "map_client*", "map_mcp*", "map_types*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reference", "tmp"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
